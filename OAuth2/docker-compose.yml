services:
  # ── Terminal 1: IAM (Identity Provider) ──────────────────────
  iam:
    image: ghcr.io/navikt/mock-oauth2-server:latest
    ports:
      - "8080:8080"
    # No config needed! The server:
    # - Creates issuers dynamically (default issuer at /default)
    # - Shows an interactive login form
    # - Issues real signed JWTs verifiable via JWKS
    # - Publishes OIDC discovery at /default/.well-known/openid-configuration

  # ── Terminal 2: Backend (Resource Server) ────────────────────
  backend:
    build: ./backend
    expose:
      - "8081"
    depends_on:
      - iam
    environment:
      ISSUER: http://iam:8080/default
      FRONTEND_ORIGIN: http://localhost:3000

  # ── Terminal 3: Angular frontend ─────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
